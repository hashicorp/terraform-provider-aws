rules:
  - id: use-lazyvalidation-string-match
    languages: [go]
    message: Prefer `lazyvalidation.StringMatch` to `validation.StringMatch(regexache.MustCompile(...), ...)`
    patterns:
      - pattern: validation.StringMatch(regexache.MustCompile($PATTERN), $MESSAGE)
      - pattern-not-inside: validation.ToDiagFunc(validation.StringMatch(...))
    fix: lazyvalidation.StringMatch($PATTERN, $MESSAGE)
    severity: WARNING

  - id: use-lazyvalidation-string-match-function-regex
    languages: [go]
    message: Replace the function-returned regular expression with a pattern string and use `lazyvalidation.StringMatch`
    pattern: validation.StringMatch($REGEX(), $...ARGS)
    severity: WARNING

  - id: use-lazyvalidation-string-match-diag
    languages: [go]
    message: Prefer `lazyvalidation.StringMatchDiag` to `validation.ToDiagFunc(validation.StringMatch(...))`
    pattern: validation.ToDiagFunc(validation.StringMatch(regexache.MustCompile($PATTERN), $MESSAGE))
    fix: lazyvalidation.StringMatchDiag($PATTERN, $MESSAGE)
    severity: WARNING

  - id: use-lazyvalidation-string-does-not-match
    languages: [go]
    message: Prefer `lazyvalidation.StringDoesNotMatch` to `validation.StringDoesNotMatch(regexache.MustCompile(...), ...)`
    patterns:
      - pattern: validation.StringDoesNotMatch(regexache.MustCompile($PATTERN), $MESSAGE)
      - pattern-not-inside: validation.ToDiagFunc(validation.StringDoesNotMatch(...))
    fix: lazyvalidation.StringDoesNotMatch($PATTERN, $MESSAGE)
    severity: WARNING

  - id: use-lazyvalidation-string-does-not-match-diag
    languages: [go]
    message: Prefer `lazyvalidation.StringDoesNotMatchDiag` to `validation.ToDiagFunc(validation.StringDoesNotMatch(...))`
    pattern: validation.ToDiagFunc(validation.StringDoesNotMatch(regexache.MustCompile($PATTERN), $MESSAGE))
    fix: lazyvalidation.StringDoesNotMatchDiag($PATTERN, $MESSAGE)
    severity: WARNING
