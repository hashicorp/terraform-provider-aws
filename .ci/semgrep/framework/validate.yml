rules:
  - id: use-lazystringvalidator-regex-matches
    languages: [go]
    message: Prefer `lazystringvalidator.RegexMatches` to `stringvalidator.RegexMatches(regexache.MustCompile(...), ...)`
    pattern: stringvalidator.RegexMatches(regexache.MustCompile($PATTERN), $MESSAGE)
    fix: lazystringvalidator.RegexMatches($PATTERN, $MESSAGE)
    severity: WARNING
