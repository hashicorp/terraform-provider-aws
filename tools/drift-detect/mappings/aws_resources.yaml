# AWS resource mapping file.
#
# Top-level sections:
#
#   resources:
#     Each entry maps one Terraform resource to AWS Smithy shapes and
#     operations used to derive its comparable fields. This file is the bridge
#     between the operation-centric AWS API models and the resource-centric
#     Terraform schema.
#
# Resource fields:
#   smithy_resource     - optional Smithy resource shape name for
#                         lifecycle inference (put/create/read/update/delete/list)
#   lifecycle           - optional operation name overrides (without namespace)
#                         for create/put/read/update/delete/list and additional
#                         resource operations
#   suppress_fields     - member names to drop from the extracted IR (URL path
#                         identifiers, idempotency tokens, internal AWS fields)
#   field_renames       - map of aws_member_name -> tf_attribute_name overrides
#   attribute_map_enum  - optional enum shape name whose enumValue entries are
#                         expanded into IR fields
#   explicit_fields     - optional hand-authored fields for cases where model
#                         metadata is insufficient to enumerate attributes
#
# Extraction is capability-based:
#   - lifecycle extraction via smithy_resource and/or lifecycle
#   - enum expansion via attribute_map_enum
#   - explicit field insertion via explicit_fields

skip_resources:
  aws_sqs_queue_policy:
    reason: Sub-resource managed through QueueAttributeName.Policy on aws_sqs_queue.
  aws_sqs_queue_redrive_policy:
    reason: Sub-resource managed through QueueAttributeName.RedrivePolicy on aws_sqs_queue.
  aws_sqs_queue_redrive_allow_policy:
    reason: Sub-resource managed through QueueAttributeName.RedriveAllowPolicy on aws_sqs_queue.
  aws_elastictranscoder_pipeline:
    reason: AWS Elastic Transcoder Service is deprecated and is no longer available for use.
  aws_elastictranscoder_preset:
    reason: AWS Elastic Transcoder Service is deprecated and is no longer available for use.
  aws_evidently_feature:
    reason: AWS Evidently is deprecated and is no longer available for use.
  aws_evidently_launch:
    reason: AWS Evidently is deprecated and is no longer available for use.
  aws_evidently_project:
    reason: AWS Evidently is deprecated and is no longer available for use.
  aws_evidently_segment:
    reason: AWS Evidently is deprecated and is no longer available for use.
  aws_qldb_ledger:
    reason: AWS QLDB is deprecated and is no longer available for use.
  aws_qldb_stream:
    reason: AWS QLDB is deprecated and is no longer available for use.

suppress_fields:
  - NextToken
  - MaxResults

resources:

  # -------------------------------------------------------------------------
  # AMP workspace — typed Smithy structures
  # -------------------------------------------------------------------------
  aws_prometheus_workspace:
    field_renames:
      workspaceId: id

  aws_prometheus_resource_policy:
    smithy_resource: WorkspaceResourcePolicy

  # -------------------------------------------------------------------------
  # SQS — attribute-map with QueueAttributeName enum
  # -------------------------------------------------------------------------
  aws_sqs_queue:
    lifecycle:
      create: CreateQueue
      read: GetQueueAttributes
      update: SetQueueAttributes
      delete: DeleteQueue
      list: ListQueues
    attribute_map_enum: QueueAttributeName
    suppress_fields:
      # Read-only/metrics — no TF config equivalent
      - ApproximateNumberOfMessages
      - ApproximateNumberOfMessagesNotVisible
      - ApproximateNumberOfMessagesDelayed
      - CreatedTimestamp
      - LastModifiedTimestamp
      # Not a per-resource field
      - All
    field_renames:
      VisibilityTimeout: visibility_timeout_seconds
      MaximumMessageSize: max_message_size
      MessageRetentionPeriod: message_retention_seconds
      ReceiveMessageWaitTimeSeconds: receive_wait_time_seconds
      QueueArn: arn
      QueueUrl: url
      QueueName: name
      QueueNamePrefix: name_prefix

  # -------------------------------------------------------------------------
  # SNS — untyped attribute map; field names from explicit_fields
  # -------------------------------------------------------------------------
  aws_sns_topic:
    lifecycle:
      create: CreateTopic
      read: GetTopicAttributes
    attribute_map_field: Attributes
    attribute_map_enum: ""
    suppress_fields: []
    field_renames: {
      topic_arn: arn,
    }
    explicit_fields:
      - name: DisplayName
        type: string
        required: false
      - name: KmsMasterKeyId
        type: string
        required: false
      - name: FifoTopic
        type: bool
        required: false
      - name: ContentBasedDeduplication
        type: bool
        required: false
      - name: Policy
        type: string
        required: false
      - name: DeliveryPolicy
        type: string
        required: false
      - name: TracingConfig
        type: string
        required: false
      - name: SignatureVersion
        type: string
        required: false
      - name: ArchivePolicy
        type: string
        required: false
