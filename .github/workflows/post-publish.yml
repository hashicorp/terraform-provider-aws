name: Post Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        description: "Semver release tag e.g. 1.1.0 (v prefix will be added automatically)"
        required: true

permissions:
  issues: read # required to search issues
  pull-requests: read # required to search pull requests

jobs:
  tidy-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Tidy Jira
        uses: breathingdust/github-jira-tidy@d4f9f6b36a7d9edb32ebfaa3c6f09d4b92ce7792 # v0.18.0
        with:
          jira_host: "hashicorp.atlassian.net"
          jira_username: "sdavis3@ibm.com"
          jira_password: ${{ secrets.jira_password }}
          jira_jql_filter: ${{ secrets.jira_jql_filter }}
          jira_github_url_field_id: "Issue Link[URL Field]"
          jira_frb_github_url_field_id: "GitHub Issue/PR[URL Field]"
          github_release_name: v${{ github.event.inputs.release_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
