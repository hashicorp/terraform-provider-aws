name: Maintainer Helpers

permissions:
  contents: read        # required for checkout
  issues: write         # required to update labels on issues
  pull-requests: write  # required to update labels on pull requests

on:
  issues:
    types:
      - assigned
      - opened
      - labeled
      - unlabeled

  pull_request_target:
    types:
      - assigned
      - closed
      - opened
      - labeled
      - unlabeled

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  schedule:
    - cron: "0 15 * * 1-5"

env:
  AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
  ISSUE_URL: ${{ github.event.issue.html_url ||  github.event.pull_request.html_url }}

jobs:
  workboard:
    name: Team Workboard
    runs-on: ubuntu-latest
    if: contains(fromJSON('["assigned", "labeled", "opened", "unlabeled"]'), github.event.action)
    env:
      CURRENT_LABELS: ${{ github.event_name == 'issues' && toJSON(github.event.issue.labels.*.name) || toJSON(github.event.pull_request.labels.*.name) }}
      GH_CLI_SUBCOMMAND: ${{ github.event_name == 'pull_request_target' && 'pr' || 'issue' }}
      ITEM_STATE: ${{ github.event.issue.state || github.event.pull_request.state }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/

      - name: Community Check
        id: community_check
        if: contains(fromJSON('["opened", "assigned"]'), github.event.action)
        uses: ./.github/actions/community_check
        with:
          user_login: ${{ github.event.action == 'assigned' && github.event.assignee.login || env.AUTHOR }}
          maintainers: ${{ secrets.MAINTAINERS }}

      - name: Add Maintainer Pull Requests and Assignments
        id: workboard_maintainer
        if: |
          ((github.event_name == 'pull_request_target' && github.event.action == 'opened') || github.event.action == 'assigned')
          && steps.community_check.outputs.maintainer == 'true'
          && env.ITEM_STATE == 'open'
        uses: ./.github/actions/team_working_board
        with:
          github_token: ${{ steps.token.outputs.token }}
          item_url: ${{ env.ISSUE_URL }}
          status: ${{ github.event.action == 'opened' && 'Maintainer PR' || 'In Progress' }}
          view: "working-board"

      - name: Label Prioritized Items
        id: label_prioritized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # prevents an additional 'labeled' event
        if: |
          github.event.action != 'unlabeled'
          && env.ITEM_STATE == 'open'
          && ((steps.workboard_maintainer.outcome != 'skipped') || contains(fromJSON('["crash", "regression"]'), github.event.label.name))
          && !contains(fromJSON(env.CURRENT_LABELS), 'prioritized')
        run: gh $GH_CLI_SUBCOMMAND edit $ISSUE_URL --add-label prioritized

      - name: Add Auto-Labeled Items
        if: |
          steps.label_prioritized.outcome == 'success'
          || (github.event.action == 'labeled'
            && contains(fromJSON('["crash", "regression"]'), github.event.label.name)
            && env.ITEM_STATE == 'open')
        uses: ./.github/actions/team_working_board
        with:
          github_token: ${{ steps.token.outputs.token }}
          item_url: ${{ env.ISSUE_URL }}
          view: "working-board"
          move_to_top: ${{ contains(fromJSON('["crash", "regression"]'), github.event.label.name) }}

      - name: Add Prioritized Items
        if: |
          github.event.action == 'labeled'
          && github.event.label.name == 'prioritized'
          && env.ITEM_STATE == 'open'
        uses: ./.github/actions/team_working_board
        with:
          github_token: ${{ steps.token.outputs.token }}
          item_url: ${{ env.ISSUE_URL }}
          view: "working-board"

      - name: Unlabel Closed Items
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # prevents an additional 'unlabeled' event
        if: |
          github.event.action == 'labeled'
          && github.event.label.name == 'prioritized'
          && env.ITEM_STATE != 'open'
        run: gh $GH_CLI_SUBCOMMAND edit $ISSUE_URL --remove-label prioritized

      - name: Remove Unprioritized Items
        if: |
          github.event.action == 'unlabeled'
          && github.event.label.name == 'prioritized'
        uses: ./.github/actions/team_working_board
        with:
          github_token: ${{ steps.token.outputs.token }}
          item_url: ${{ env.ISSUE_URL }}
          remove: true

  slack:
    name: Slack Feeds
    runs-on: ubuntu-latest
    if: github.event.action != 'assigned' && github.event.action != 'unlabeled' # the only situations without any notifications
    env:
      ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
      AUTHOR_URL: ${{ github.event.issue.user.html_url || github.event.pull_request.user.html_url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/
            .changie.yaml

      - name: Community Check
        id: community_check
        if: |
          github.event.action == 'opened'
          && github.event_name == 'pull_request_target'
        uses: ./.github/actions/community_check
        with:
          user_login: ${{ env.AUTHOR }}
          maintainers: ${{ secrets.MAINTAINERS }}
          partners: ${{ secrets.PARTNERS }}

      - name: New Maintainer Pull Request
        if: |
          steps.community_check.outputs.maintainer == 'true'
          && github.actor != 'dependabot[bot]'
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.FEED_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':open-5403: <{0}|{1}> opened <{2}|{3}>', env.AUTHOR_URL, env.AUTHOR, env.ISSUE_URL, env.ISSUE_TITLE)) }}
                  }
                }
              ]
            }

      - name: New Partner Pull Request
        if: steps.community_check.outputs.partner == 'true'
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.FEED_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':open-5403: :aws: contributor <{0}|{1}> opened <{2}|{3}>', env.AUTHOR_URL, env.AUTHOR, env.ISSUE_URL, env.ISSUE_TITLE)) }}
                  }
                }
              ]
            }

      - name: Crashes and Regressions
        if: github.event.label.name == 'regression' || github.event.label.name == 'crash'
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel" : "${{ secrets.SLACK_CHANNEL }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":warning: The following ${{ github.event_name == 'issues' && 'issue' || 'pull request' }} has been labeled as a ${{ github.event.label.name }}:",
                    "emoji": true
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "rich_text",
                  "elements": [
                    {
                      "type": "rich_text_section",
                      "elements": [
                        {
                          "type": "link",
                          "text": ${{ toJSON(env.ISSUE_TITLE) }},
                          "url": ${{ toJSON(env.ISSUE_URL) }}
                        }
                      ]
                    }
                  ]
                }
              ]
            }

      - name: Pull Request Merged
        if: github.event.pull_request.merged
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        env:
          MERGED_BY_URL: ${{ github.event.pull_request.merged_by.html_url }}
          MERGED_BY_LOGIN: ${{ github.event.pull_request.merged_by.login }}
        with:
          webhook: ${{ secrets.FEED_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':merged-rounded: <{0}|{1}> merged <{2}|{3}>', env.MERGED_BY_URL, env.MERGED_BY_LOGIN, env.ISSUE_URL, env.ISSUE_TITLE)) }}
                  }
                }
              ]
            }

      - name: Get Changes Directory
        id: changes-dir
        if: github.event.pull_request.merged
        shell: bash
        run: echo "changes_dir=$(yq eval '.changesDir' .changie.yaml)" >> $GITHUB_OUTPUT

      - name: Check for Missing CHANGELOG Fragment
        id: fragment-filter
        if: github.event.pull_request.merged
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          predicate-quantifier: 'every'
          filters: |
            service_files:
              - 'internal/service/**/*.go'
              - '!internal/service/**/*_test.go'
            changie_fragments:
              - added: '${{ steps.changes-dir.outputs.changes_dir }}/unreleased/*.yaml'

      - name: Format Missing Fragment File List
        id: format-files
        if: |
          steps.fragment-filter.outputs.service_files == 'true' &&
          steps.fragment-filter.outputs.changie_fragments != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'no-changelog-needed')
        env:
          SERVICE_FILES_JSON: ${{ steps.fragment-filter.outputs.service_files_files }}
        shell: bash
        run: |
          FORMATTED=$(jq -r '.[] | "• `\(.)`"' <<< "$SERVICE_FILES_JSON")
          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            echo "formatted<<${DELIMITER}"
            echo "$FORMATTED"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Maintainers of Missing CHANGELOG Entry
        if: steps.format-files.outcome != 'skipped'
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          webhook: ${{ secrets.FEED_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Missing CHANGELOG Entry*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('Pull request <{0}|#{1}: {2}> was merged but is missing a required CHANGELOG entry.', env.PR_URL, env.PR_NUMBER, env.PR_TITLE)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Files that require a CHANGELOG entry:*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.format-files.outputs.formatted) }}
                  }
                }
              ]
            }

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: github.event_name == 'schedule'
        id: token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Open Maintainer Pull Request Stats
        if: steps.token.outcome != 'skipped'
        uses: breathingdust/github-team-slackbot@86aab12fa9d04755f51c543c9211acf6caa7005a # v18.5.4
        with:
          github_token: ${{ steps.token.outputs.token }}
          team_slug: terraform-aws
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}

      - name: Release Tag
        if: github.event_name == 'push'
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.FEED_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":tag: <https://github.com/${{ github.event.pusher.name }}|${{ github.event.pusher.name }}> pushed tag <https://github.com/hashicorp/terraform-provider-aws/tree/${{ github.event.ref }}|${{ github.event.ref }}>"
                  }
                }
              ]
            }
