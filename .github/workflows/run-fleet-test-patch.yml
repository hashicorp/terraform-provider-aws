name: Run Fleet zero-capacity test patch

on:
  push:
    branches:
      - fix/codebuild-fleet-base-capacity-zero

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codebuild-fleet-base-capacity-zero
          fetch-depth: 0

      - name: Add zero base capacity regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/service/codebuild/fleet_test.go")
          text = path.read_text()
          old = '''\t\t\t\tConfig: testAccFleetConfig_baseCapacity(rName, 1),\n\t\t\t\tCheck: resource.ComposeTestCheckFunc(\n\t\t\t\t\ttestAccCheckFleetExists(ctx, t, resourceName),\n\t\t\t\t\tresource.TestCheckResourceAttr(resourceName, "base_capacity", "1"),\n\t\t\t\t),'''
          new = '''\t\t\t\tConfig: testAccFleetConfig_baseCapacity(rName, 0),\n\t\t\t\tCheck: resource.ComposeTestCheckFunc(\n\t\t\t\t\ttestAccCheckFleetExists(ctx, t, resourceName),\n\t\t\t\t\tresource.TestCheckResourceAttr(resourceName, "base_capacity", "0"),\n\t\t\t\t),'''
          if old not in text:
              raise SystemExit("expected test block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/service/codebuild/fleet_test.go

      - name: Commit test and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/service/codebuild/fleet_test.go
          git rm .github/workflows/add-fleet-zero-test.yml .github/workflows/run-fleet-test-patch.yml
          git commit -m "test(codebuild): cover zero fleet base capacity"
          git push origin HEAD:fix/codebuild-fleet-base-capacity-zero
