name: Fix CodeBuild Fleet

on:
  push:
    paths:
      - .github/workflows/fix-codebuild-fleet.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codebuild-fleet-base-capacity-zero
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply fix and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          file="internal/service/codebuild/fleet.go"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("internal/service/codebuild/fleet.go")
          s = p.read_text()
          old = '"base_capacity": {\n\t\t\t\t\tType:         schema.TypeInt,\n\t\t\t\t\tRequired:     true,\n\t\t\t\t\tValidateFunc: validation.IntAtLeast(1),'
          new = '"base_capacity": {\n\t\t\t\t\tType:         schema.TypeInt,\n\t\t\t\t\tRequired:     true,\n\t\t\t\t\tValidateFunc: validation.IntAtLeast(0),'
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one base_capacity validator, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
          go test ./internal/service/codebuild

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/service/codebuild/fleet.go
          git rm .github/workflows/fix-codebuild-fleet.yml
          git commit -m "fix(codebuild): allow zero base capacity for fleets"
          git push origin HEAD:fix/codebuild-fleet-base-capacity-zero
