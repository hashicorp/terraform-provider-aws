name: Update AWS SDK for Go v2

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 9 * * MON"

permissions:
  contents: write       # required to push commits
  pull-requests: write  # required to create or update the automation pull request

concurrency:
  group: update-aws-sdk-go-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Update dependencies
        shell: bash
        run: |
          go mod edit -json > "$RUNNER_TEMP/go-mod.json"
          module_paths=$(jq -r '
            .Require[]
            | select(.Path == "github.com/aws/aws-sdk-go-v2"
                or (.Path | startswith("github.com/aws/aws-sdk-go-v2/")))
            | .Path + "@latest"
          ' "$RUNNER_TEMP/go-mod.json")
          if [[ -z "$module_paths" ]]; then
            echo "No AWS SDK for Go v2 modules found" >&2
            exit 1
          fi
          modules=()
          while IFS= read -r module; do
            modules+=("$module")
          done <<< "$module_paths"
          go get "${modules[@]}"
          go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Summarize module changes
        id: module_changes
        shell: bash
        run: |
          go mod edit -json > "$RUNNER_TEMP/go-mod-updated.json"
          table=$(jq -nr \
            --slurpfile before "$RUNNER_TEMP/go-mod.json" \
            --slurpfile after "$RUNNER_TEMP/go-mod-updated.json" '
            ($before[0].Require | INDEX(.Path)) as $old
            | ($after[0].Require | INDEX(.Path)) as $new
            | "| Module | Old version | New version |",
              "| --- | --- | --- |",
              (($old + $new | keys[]) as $path
                | select($old[$path].Version != $new[$path].Version)
                | "| `\($path)` | `\($old[$path].Version // "-")` | `\($new[$path].Version // "-")` |")
          ')
          {
            echo 'table<<EOF'
            printf '%s\n' "$table"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Identify SDK releases
        id: sdk_releases
        shell: bash
        run: |
          jq -n \
            --slurpfile before "$RUNNER_TEMP/go-mod.json" \
            --slurpfile after "$RUNNER_TEMP/go-mod-updated.json" '
            "github.com/aws/aws-sdk-go-v2" as $prefix
            | ($before[0].Require | INDEX(.Path)) as $old
            | [
                $after[0].Require[]
                | select(.Path == $prefix or (.Path | startswith($prefix + "/")))
                | select(.Version != $old[.Path].Version)
                | if .Path == $prefix then .Version
                  # Go module tags omit the /vN major-version suffix from module paths.
                  else (.Path | ltrimstr($prefix + "/") | sub("/v([2-9]|[1-9][0-9]+)$"; "")) + "/" + .Version
                  end
              ]
          ' > "$RUNNER_TEMP/sdk-module-tags.json"
          module_tags=$(jq -r '.[]' "$RUNNER_TEMP/sdk-module-tags.json")
          patterns=('refs/tags/release-*')
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            patterns+=("refs/tags/$tag" "refs/tags/$tag^{}")
          done <<< "$module_tags"
          if ! git ls-remote https://github.com/aws/aws-sdk-go-v2.git "${patterns[@]}" > "$RUNNER_TEMP/sdk-tags"; then
            echo "::warning::Unable to look up AWS SDK for Go v2 tags"
            : > "$RUNNER_TEMP/sdk-tags"
          fi
          jq -Rs --slurpfile modules "$RUNNER_TEMP/sdk-module-tags.json" '
            # Compare revisions numerically: .10 follows .2, and an unsuffixed date is revision 0.
            def release_key:
              ltrimstr("refs/tags/release-") | split(".") | [.[0], (.[1] // "0" | tonumber)];
            split("\n")
            | map(select(length > 0) | split("\t") | {sha: .[0], ref: .[1]})
            # Annotated tags have separate object IDs; prefer their peeled ^{} commit IDs.
            | group_by(.ref | rtrimstr("^{}"))
            | map(sort_by(.ref | endswith("^{}")) | last | .ref |= rtrimstr("^{}"))
            | . as $tags
            | ($tags | INDEX(.ref)) as $index
            | ($tags
                | map(select(.ref | test("^refs/tags/release-[0-9]{4}-[0-9]{2}-[0-9]{2}(\\.[0-9]+)?$")))
                | sort_by(.ref | release_key) | reverse) as $releases
            | [
                $modules[0][]
                | $index["refs/tags/" + .] as $module
                | if $module == null then null
                  else first($releases[] | select(.sha == $module.sha)) // null
                  end
              ] as $matches
            | {
                unmatched: ($matches | map(select(. == null)) | length),
                releases: ([$matches[] | select(. != null)] | unique_by(.ref)
                  | sort_by(.ref | release_key) | reverse | map(.ref | ltrimstr("refs/tags/")))
              }
          ' "$RUNNER_TEMP/sdk-tags" > "$RUNNER_TEMP/sdk-release-matches.json"
          title="deps: update AWS SDK for Go v2"
          target=$(jq -r '.releases[0] // empty' "$RUNNER_TEMP/sdk-release-matches.json")
          unmatched=$(jq -r '.unmatched' "$RUNNER_TEMP/sdk-release-matches.json")
          {
            echo "Module versions are matched to release tags sharing the same commit; the target is the newest matching release, not an exact SDK-wide snapshot."
            echo
            # Only label the target when every changed SDK module has an exact tag-to-commit match.
            if [[ -n "$target" && "$unmatched" == 0 ]]; then
              title+=" to $target"
              printf 'Target release: [%s](https://github.com/aws/aws-sdk-go-v2/releases/tag/%s).\n\n' "$target" "$target"
            fi
            if [[ -n "$target" ]]; then
              echo "Published releases containing the updated SDK module versions (intermediate releases are not listed):"
              echo
              jq -r '.releases[] | "- [\(.)](https://github.com/aws/aws-sdk-go-v2/releases/tag/\(.))"' "$RUNNER_TEMP/sdk-release-matches.json"
            else
              echo "No corresponding SDK release tag could be determined."
            fi
            if [[ "$unmatched" != 0 ]]; then
              echo
              echo "Some updated SDK module tags could not be matched to a release tag on the same commit; the PR title is left unversioned."
            fi
            echo
            echo "[All AWS SDK for Go v2 release notes](https://github.com/aws/aws-sdk-go-v2/releases)"
          } > "$RUNNER_TEMP/sdk-release-notes"
          if [[ "$unmatched" != 0 ]]; then
            echo "::warning::$unmatched updated SDK module versions could not be matched to release tags on the same commit"
          fi
          {
            printf 'title=%s\n' "$title"
            echo 'notes<<EOF'
            cat "$RUNNER_TEMP/sdk-release-notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          installation_retrieval_mode: id
          installation_retrieval_payload: ${{ secrets.INSTALLATION_ID }}
          private_key: ${{ secrets.APP_PEM }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: automation/update-aws-sdk-go-v2
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            go.mod
            go.sum
          commit-message: "deps: update AWS SDK for Go v2"
          title: ${{ steps.sdk_releases.outputs.title }}
          body: |
            <!-- Copyright IBM Corp. 2014, 2026 -->
            <!-- SPDX-License-Identifier: MPL-2.0 -->

            <!---
            See what makes a good Pull Request at: https://hashicorp.github.io/terraform-provider-aws/raising-a-pull-request/
            --->

            <!-- heimdall_github_prtemplate:grc-pci_dss-2024-01-05 -->

            ## Rollback Plan

            If a change needs to be reverted, we will publish an updated version of the library.

            ## Changes to Security Controls

            Are there any changes to security controls (access controls, encryption, logging) in this pull request? If so, explain.

            Dependency changes require maintainer review; this automation does not assess security-control impact.

            ### Description
            <!---
            Please provide a helpful description of what change this pull request will introduce.
            --->

            Updates all AWS SDK for Go v2 modules required by the root Go module in one batch.
            Generated by the Update AWS SDK for Go v2 workflow. Maintainers should review the changes and understand their end-user impact.

            #### SDK releases

            ${{ steps.sdk_releases.outputs.notes }}

            #### Module changes

            Includes direct and indirect dependencies. A `-` indicates a module was added or removed.

            ${{ steps.module_changes.outputs.table }}

            ### Relations
            <!---
            If your pull request fully resolves and should automatically close the linked issue, use Closes. Otherwise, use Relates.

            For Example:

            Relates #0000
            or
            Closes #0000
            --->

            No linked issue.

            ### References
            <!---
            Optionally, provide any helpful references that may help the reviewer(s).
            --->

            https://github.com/aws/aws-sdk-go-v2

            ### Output from Acceptance Testing
            <!--
            Replace TestAccXXX with a pattern that matches the tests affected by this PR.

            Replace ec2 with the service package corresponding to your tests.

            For more information on the `-run` flag, see the `go test` documentation at https://tip.golang.org/cmd/go/#hdr-Testing_flags.
            -->

            Acceptance tests were not run by this workflow.
            Workflow validation: `go mod tidy` passed; `go mod verify` passed.
