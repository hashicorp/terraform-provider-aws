# TEMPORARY: verifies the GitHub App (APP_ID/APP_PEM) can write repository
# secrets. Writes, verifies, and deletes a dummy secret. Delete this branch
# after the run.

name: Test GitHub App Secrets Permission

on:
  push:
    branches:
      - test-app-secrets-permission

permissions: {}

jobs:
  test:
    name: Test Secrets Write
    if: github.repository == 'hashicorp/terraform-provider-aws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
          permission-secrets: write

      - name: Write, Verify, and Delete Dummy Secret
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SECRET_NAME: ROTATION_PERMISSION_TEST
        run: |
          set -euo pipefail

          echo "1. Read repository public key (needs Secrets: read)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" --jq '"   key_id: " + .key_id'

          echo "2. Write dummy secret (needs Secrets: write)"
          printf '%s' "test-$(date +%s)" | gh secret set "$SECRET_NAME" --repo "$GITHUB_REPOSITORY"

          echo "3. Verify dummy secret exists"
          gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/${SECRET_NAME}" --jq '"   " + .name + " updated_at: " + .updated_at'

          echo "4. Delete dummy secret"
          gh secret delete "$SECRET_NAME" --repo "$GITHUB_REPOSITORY"

          echo "5. Check SLACK_BOT_TOKEN is a repository secret (rotation writes it at repo level)"
          if gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/SLACK_BOT_TOKEN" --jq '"   SLACK_BOT_TOKEN repo secret, updated_at: " + .updated_at' 2>/dev/null; then
            :
          else
            echo "::warning::SLACK_BOT_TOKEN is not a repository secret (likely an organization secret)."
          fi

          echo "GitHub App can write repository secrets."
