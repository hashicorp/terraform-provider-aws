name: crt-post-promote-production

on:
  repository_dispatch:
    types:
      - crt-post-promote-production
      - crt-post-promote-production::*

permissions:
  actions: write # required to dispatch workflows

jobs:
  start-registry-check:
    name: Start Registry Check
    runs-on: ubuntu-latest
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.payload.version }}
        run: |
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if output=$(gh workflow run \
              --repo "${{ github.repository }}" \
              --ref main \
              --field version="$VERSION" \
              registry-check.yml 2>&1); then
              echo "Dispatched registry-check.yml (attempt ${attempt})"
              exit 0
            fi
            echo "$output"
            # The dispatch is not idempotent, so only retry when GitHub
            # definitively rejected the request due to a rate limit. Ambiguous
            # failures (e.g. a lost response) could have created a dispatch, so
            # fail fast and let the failure alert prompt a manual reconcile.
            if ! grep -qiE 'rate limit|HTTP 403' <<<"$output"; then
              echo "::error::Failed to dispatch registry-check.yml (non-retryable error)."
              exit 1
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Attempt ${attempt} hit a rate limit dispatching registry-check.yml; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::Failed to dispatch registry-check.yml after ${max_attempts} attempts (GitHub API rate limit). Re-run this workflow once the limit resets."
          exit 1
  create-update-changelog-pr:
    name: Create Update Changelog PR
    runs-on: ubuntu-latest
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.payload.version }}
        run: |
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if output=$(gh workflow run \
              --repo "${{ github.repository }}" \
              --ref main \
              --field previous_version="$VERSION" \
              update-changelog.yml 2>&1); then
              echo "Dispatched update-changelog.yml (attempt ${attempt})"
              exit 0
            fi
            echo "$output"
            # The dispatch is not idempotent, so only retry when GitHub
            # definitively rejected the request due to a rate limit. Ambiguous
            # failures (e.g. a lost response) could have created a dispatch, so
            # fail fast and let the failure alert prompt a manual reconcile.
            if ! grep -qiE 'rate limit|HTTP 403' <<<"$output"; then
              echo "::error::Failed to dispatch update-changelog.yml (non-retryable error)."
              exit 1
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Attempt ${attempt} hit a rate limit dispatching update-changelog.yml; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::Failed to dispatch update-changelog.yml after ${max_attempts} attempts (GitHub API rate limit). Re-run this workflow once the limit resets."
          exit 1
  post-publish:
    name: Runs post publish actions
    runs-on: ubuntu-latest
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.payload.version }}
        run: |
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if output=$(gh workflow run \
              --repo "${{ github.repository }}" \
              --ref main \
              --field release_tag="$VERSION" \
              post-publish.yml 2>&1); then
              echo "Dispatched post-publish.yml (attempt ${attempt})"
              exit 0
            fi
            echo "$output"
            # The dispatch is not idempotent, so only retry when GitHub
            # definitively rejected the request due to a rate limit. Ambiguous
            # failures (e.g. a lost response) could have created a dispatch, so
            # fail fast and let the failure alert prompt a manual reconcile.
            if ! grep -qiE 'rate limit|HTTP 403' <<<"$output"; then
              echo "::error::Failed to dispatch post-publish.yml (non-retryable error)."
              exit 1
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Attempt ${attempt} hit a rate limit dispatching post-publish.yml; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::Failed to dispatch post-publish.yml after ${max_attempts} attempts (GitHub API rate limit). Re-run this workflow once the limit resets."
          exit 1

  notify-failure:
    name: Alert on Post-Promote Failure
    needs:
      - start-registry-check
      - create-update-changelog-pr
      - post-publish
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post Slack Alert
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL }}",
              "text": ":rotating_light: crt-post-promote-production failed for version ${{ github.event.client_payload.payload.version }}. One or more post-release dispatches (registry-check, update-changelog, post-publish) did not run — often a GitHub API rate limit (HTTP 403) that can persist until the daily reset. The CHANGELOG's next '(Unreleased)' heading and PR milestones depend on these. Re-run the failed jobs once the limit resets: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
