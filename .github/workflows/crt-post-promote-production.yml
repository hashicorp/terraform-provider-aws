name: crt-post-promote-production

on:
  repository_dispatch:
    types:
      - crt-post-promote-production
      - crt-post-promote-production::*

permissions:
  actions: write # required to dispatch workflows

jobs:
  start-registry-check:
    name: Start Registry Check
    runs-on: ubuntu-latest
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 5); do
            if gh workflow run \
              --repo "${{ github.repository }}" \
              --ref main \
              --field version="${{ github.event.client_payload.payload.version }}" \
              registry-check.yml; then
              echo "Dispatched registry-check.yml (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Attempt ${attempt} to dispatch registry-check.yml failed; retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done
          echo "::error::Failed to dispatch registry-check.yml after 5 attempts (possible GitHub API rate limit). Re-run this workflow once the limit resets."
          exit 1
  create-update-changelog-pr:
    name: Create Update Changelog PR
    runs-on: ubuntu-latest
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 5); do
            if gh workflow run \
              --repo "${{ github.repository }}" \
              --ref main \
              --field previous_version="${{ github.event.client_payload.payload.version }}" \
              update-changelog.yml; then
              echo "Dispatched update-changelog.yml (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Attempt ${attempt} to dispatch update-changelog.yml failed; retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done
          echo "::error::Failed to dispatch update-changelog.yml after 5 attempts (possible GitHub API rate limit). Re-run this workflow once the limit resets."
          exit 1
  post-publish:
    name: Runs post publish actions
    runs-on: ubuntu-latest
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 5); do
            if gh workflow run \
              --repo "${{ github.repository }}" \
              --ref main \
              --field release_tag="${{ github.event.client_payload.payload.version }}" \
              post-publish.yml; then
              echo "Dispatched post-publish.yml (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Attempt ${attempt} to dispatch post-publish.yml failed; retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done
          echo "::error::Failed to dispatch post-publish.yml after 5 attempts (possible GitHub API rate limit). Re-run this workflow once the limit resets."
          exit 1

  notify-failure:
    name: Alert on Post-Promote Failure
    needs:
      - start-registry-check
      - create-update-changelog-pr
      - post-publish
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post Slack Alert
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL }}",
              "text": ":rotating_light: crt-post-promote-production failed for version ${{ github.event.client_payload.payload.version }}. One or more post-release dispatches (registry-check, update-changelog, post-publish) did not run — often a GitHub API rate limit (HTTP 403) that can persist until the daily reset. The CHANGELOG's next '(Unreleased)' heading and PR milestones depend on these. Re-run the failed jobs once the limit resets: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
