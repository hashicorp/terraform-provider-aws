name: crt-post-promote-production

on:
  repository_dispatch:
    types:
      - crt-post-promote-production
      - crt-post-promote-production::*

permissions:
  actions: write # required to dispatch workflows

jobs:
  dispatch:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Long enough to wait out one full hourly GITHUB_TOKEN rate-limit window.
    timeout-minutes: 80
    strategy:
      # Each dispatch is independent; one failing must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - name: Start Registry Check
            workflow: registry-check.yml
            field: version
          - name: Create Update Changelog PR
            workflow: update-changelog.yml
            field: previous_version
          - name: Runs post publish actions
            workflow: post-publish.yml
            field: release_tag
    steps:
      - name: Initiate Workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.event.client_payload.payload.version }}
          WORKFLOW: ${{ matrix.workflow }}
          FIELD: ${{ matrix.field }}
        run: |
          # GITHUB_TOKEN has an hourly, per-repository primary rate limit shared
          # by every workflow in this repo. On 2026-09-21 it was exhausted when
          # these dispatches ran, so all three failed and the CHANGELOG never got
          # its next "(Unreleased)" heading. Wait out the limit instead of failing.
          deadline=$(( $(date +%s) + 70 * 60 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            if output=$(gh workflow run "$WORKFLOW" \
              --repo "$REPO" \
              --ref main \
              --field "${FIELD}=${VERSION}" 2>&1); then
              echo "Dispatched ${WORKFLOW} (attempt ${attempt})"
              exit 0
            fi
            echo "$output"

            # The dispatch is not idempotent, so only retry when GitHub
            # definitively rejected the request due to a rate limit. Ambiguous
            # failures (e.g. a lost response) could have created a dispatch, so
            # fail fast and let the failure alert prompt a manual reconcile.
            if ! grep -qi 'rate limit' <<<"$output"; then
              echo "::error::Failed to dispatch ${WORKFLOW} (non-retryable error)."
              exit 1
            fi

            # GET /rate_limit does not count against the primary rate limit.
            # Sleep until the window resets; fall back to 60s for secondary
            # limits (or if the lookup fails), per GitHub's guidance.
            now=$(date +%s)
            reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo 0)
            wait=$(( reset - now + 5 ))
            (( wait < 60 )) && wait=60
            if (( now + wait > deadline )); then
              echo "::error::Failed to dispatch ${WORKFLOW} after ${attempt} attempts (GitHub API rate limit). Re-run this job once the limit resets."
              exit 1
            fi
            echo "::warning::Attempt ${attempt} hit a rate limit dispatching ${WORKFLOW}; retrying in ${wait}s"
            sleep "$wait"
          done

  notify-failure:
    name: Alert on Post-Promote Failure
    needs: dispatch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post Slack Alert
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL }}",
              "text": ":rotating_light: crt-post-promote-production failed for version ${{ github.event.client_payload.payload.version }}. One or more post-release dispatches (registry-check, update-changelog, post-publish) may not have started. The CHANGELOG's next '(Unreleased)' heading and PR milestones depend on update-changelog. Check which downstream workflows already started (a dispatch can succeed even if the call reported failure), then re-run only the failed jobs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
